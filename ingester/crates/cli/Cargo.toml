[package]
name = "indexer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
indexer-types = { path = "../types" }
indexer-store = { path = "../store" }
indexer-continuity = { path = "../continuity" }
indexer-segment = { path = "../segment" }
indexer-finalize = { path = "../finalize" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
prediction-encoder = { workspace = true }
signal-hook = "0.3"

[dev-dependencies]
rusqlite = { workspace = true }
tempdir = "0.3"

[[bin]]
name = "indexer-ingest"
path = "src/main.rs"

[[bin]]
name = "indexer-finalize"
path = "src/finalize.rs"

[[bin]]
name = "indexer-canonical-audit"
path = "src/canonical_audit.rs"
