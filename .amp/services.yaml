      VITE_UNIVERSE_API_BASE_URL: 'https://34-182-18-247.sslip.io'
      VITE_REPLAY_SIWE_DOMAIN: 'prediction-indexer-targeter-ui-b8xg.vercel.app'
      VITE_REPLAY_SIWE_URI: 'https://prediction-indexer-targeter-ui-b8xg.vercel.app/'
