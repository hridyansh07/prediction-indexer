services:
  aws-identity:
    command: |
      set -u
      while true; do
        if ./scripts/refresh-amp-aws-token; then
          sleep 2700
        else
          echo "Amp AWS identity refresh failed; retrying in 30 seconds" >&2
          sleep 30
        fi
      done

  targeter-ui:
    command: |
      set -eu
      REPO_ROOT="$(git rev-parse --show-toplevel)"
      export AWS_WEB_IDENTITY_TOKEN_FILE="$REPO_ROOT/.amp/runtime/aws-oidc-token"
      export TARGETER_UI_DECODER_PATH="$REPO_ROOT/encoder/rust/target/release/prediction-decode-v1"
      while [ ! -s "$AWS_WEB_IDENTITY_TOKEN_FILE" ]; do
        sleep 1
      done
      yarn build
      exec yarn workspace prediction-indexer-targeter-ui start
    port: 3000
    environment:
      PORT: "3000"
    portal: true
