services:
  aws-identity:
    command: |
      set -eu
      while true; do
        ./scripts/refresh-amp-aws-token
        sleep 2700
      done

  targeter-ui:
    command: |
      set -eu
      REPO_ROOT="$(git rev-parse --show-toplevel)"
      export AWS_WEB_IDENTITY_TOKEN_FILE="$REPO_ROOT/.amp/runtime/aws-oidc-token"
      while [ ! -s "$AWS_WEB_IDENTITY_TOKEN_FILE" ]; do
        sleep 1
      done
      exec yarn --cwd targeter-ui dev
    port: 3000
    environment:
      PORT: "3000"
    portal: true
